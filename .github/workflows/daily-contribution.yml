name: Daily contribution

on:
  schedule:
    # 03:17 UTC daily (~08:17 in Asia/Karachi)
    - cron: "17 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-contribution
  cancel-in-progress: false

jobs:
  keep-green:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create the daily commit
        run: |
          set -euo pipefail
          git config user.name "Usman Fazal"
          git config user.email "bscys-22f-0007@stmu.edu.pk"
          timestamp="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          mkdir -p .streak
          echo "$timestamp" >> .streak/log.txt
          git add .streak/log.txt
          if git diff --cached --quiet; then
            echo "Nothing to commit today."
            exit 0
          fi
          git commit -m "chore: keep contribution streak alive ($timestamp)"
          git push
